name: Step1073 R72 overlay explicit-close probe

on:
  push:
    branches:
      - step1073-r69-distributed-100
    paths:
      - '.github/workflows/step1073-r69-distributed-100.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install aiohttp
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir aiohttp==3.10.11

      - name: Open one overlay SSE and force-close transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import asyncio,aiohttp,json,time

          HEALTH='https://kaka-contract-realtime-worker.onrender.com/api/overlay/watchlist-stream-health'
          STREAM='https://kaka-contract-realtime-worker.onrender.com/api/overlay/watchlist-stream?items=spot%7Cbinance%7CBTCUSDT'

          async def health(session):
            async with session.get(HEALTH,timeout=15) as r:
              r.raise_for_status()
              return await r.json()

          async def main():
            connector=aiohttp.TCPConnector(limit=4,force_close=True,enable_cleanup_closed=True)
            async with aiohttp.ClientSession(connector=connector) as session:
              before=await health(session)
              response=await session.get(STREAM,headers={'Accept':'text/event-stream','Cache-Control':'no-cache'},timeout=aiohttp.ClientTimeout(total=None,connect=10,sock_read=10))
              assert response.status==200,response.status
              chunk=await asyncio.wait_for(response.content.read(4096),timeout=10)
              assert chunk, 'no_sse_bytes'
              accepted_mid=(await health(session))
              response.close()
              if response.connection and response.connection.transport:
                response.connection.transport.abort()
              await asyncio.sleep(3)
              after3=await health(session)
              await asyncio.sleep(7)
              after10=await health(session)

            out={
              'before':{'client_count':before['client_count'],'accepted':before['accepted_connections'],'closed':before['closed_connections']},
              'mid':{'client_count':accepted_mid['client_count'],'accepted':accepted_mid['accepted_connections'],'closed':accepted_mid['closed_connections']},
              'after3':{'client_count':after3['client_count'],'accepted':after3['accepted_connections'],'closed':after3['closed_connections']},
              'after10':{'client_count':after10['client_count'],'accepted':after10['accepted_connections'],'closed':after10['closed_connections']},
            }
            out['accepted_delta']=out['mid']['accepted']-out['before']['accepted']
            out['closed_delta_10s']=out['after10']['closed']-out['before']['closed']
            print(json.dumps(out,indent=2))
            assert out['accepted_delta']==1,out
            assert out['closed_delta_10s']>=1,out

          asyncio.run(main())
          PY
