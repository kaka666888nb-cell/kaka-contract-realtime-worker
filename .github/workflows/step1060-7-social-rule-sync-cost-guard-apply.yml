name: Step1060.7 social rule sync fixed-cost guard apply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/step1060-7-social-rule-sync-cost-guard-apply.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply social rule sync cost guard
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/step1060_7_social_rule_sync_cost_guard_patch.py
          node --check src/social-watch.mjs
          grep -q "step1060_7_social_rule_sync_cost_guard_v1" src/social-watch.mjs
          grep -q "const rulesChanged" src/social-watch.mjs
          grep -q "state.ruleAccountStatusNoopSkips++" src/social-watch.mjs
          git diff --check
          git diff -- src/social-watch.mjs

      - name: Commit social rule sync cost guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kaka-step1060-cost-guard'
          git config user.email 'kaka-step1060-cost-guard@users.noreply.github.com'
          git add src/social-watch.mjs
          git commit -m 'Step1060.7 reduce unchanged social rule sync reads and writes'
          git push origin HEAD:main
