name: Step1046.2.7 onchain history exhaustion builder

on:
  push:
    branches:
      - step1046-2-7-onchain-history-exhaustion

permissions:
  contents: write

jobs:
  patch-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch candidate
        run: python3 .github/scripts/step1046_2_7_patch.py
      - name: Syntax and diff checks
        run: |
          node --check src/onchain-market.mjs
          node --check src/proxy.mjs
          git diff --check
          echo 'PASS syntax + diff Step1046.2.7'
      - name: Commit candidate patch
        shell: bash
        run: |
          if git diff --quiet -- src/onchain-market.mjs src/proxy.mjs; then
            echo 'No candidate changes to commit.'
            exit 0
          fi
          git config user.name 'kaka666888nb-cell'
          git config user.email 'kaka666888nb@gmail.com'
          git add src/onchain-market.mjs src/proxy.mjs
          git commit -m 'Step1046.2.7 fix proven onchain history exhaustion'
          git push origin HEAD:step1046-2-7-onchain-history-exhaustion
