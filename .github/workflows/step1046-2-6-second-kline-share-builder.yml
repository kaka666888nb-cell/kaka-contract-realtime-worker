name: Step1046.2.6 Second Kline Share Builder

on:
  push:
    branches:
      - step1046-2-6-second-kline-share

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: step1046-2-6-second-kline-share
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact patch
        run: python3 scripts/step1046_2_6_second_kline_share_patch.py

      - name: Syntax and diff checks
        run: |
          set -euo pipefail
          node --check src/market-rest.mjs
          node --check src/proxy.mjs
          git diff --check

      - name: Static safety gates
        run: |
          set -euo pipefail
          grep -q "SECOND_KLINE_CACHE_MAX = 256" src/market-rest.mjs
          grep -q "same_exact_key_reads_scale_upstream_with_users: false" src/market-rest.mjs
          grep -q "empty_second_rows_fabricated_by_backend: false" src/market-rest.mjs
          grep -q "sharedSecondKlineResult" src/market-rest.mjs
          grep -q "one_second_history_same_exact_key_reads_share_cache_and_inflight: true" src/market-rest.mjs
          grep -q "650.8.15.197.3.3.26" src/proxy.mjs
          if grep -q "empty_second_rows_fabricated_by_backend: true" src/market-rest.mjs; then
            echo "backend must not fabricate empty-second candles" >&2
            exit 1
          fi

      - name: Commit generated candidate
        run: |
          set -euo pipefail
          git config user.name "Kaka Step1046 Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f scripts/step1046_2_6_second_kline_share_patch.py .github/workflows/step1046-2-6-second-kline-share-builder.yml
          git add src/market-rest.mjs src/proxy.mjs
          git diff --cached --check
          git commit -m "Step1046.2.6 share exact 1s history builds [skip ci]"
          git push origin HEAD:step1046-2-6-second-kline-share
