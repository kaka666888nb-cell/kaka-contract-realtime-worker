name: Step1053D.4 diagnose BTC contract rank

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/step1053d3-market-rank-materialization-fix.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dump contract rank and BTC source rows
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://kaka-contract-realtime-worker.onrender.com'
          curl -fsS --connect-timeout 8 --max-time 25 "$BASE/api/market-light/ranked-page?market_type=contract&provider=all&quote=USDT&sort=market_cap_desc&offset=0&limit=50" -o /tmp/contract.json
          curl -fsS --connect-timeout 8 --max-time 25 "$BASE/api/market-light/current-snapshot?market_type=contract&include_rows=1&offset=0&limit=5000" -o /tmp/snapshot.json
          curl -fsS --connect-timeout 8 --max-time 25 "$BASE/api/market-light/project-ranked-page?offset=0&limit=20" -o /tmp/project.json
          python3 - <<'PY'
          import json
          c=json.load(open('/tmp/contract.json'))
          s=json.load(open('/tmp/snapshot.json'))
          p=json.load(open('/tmp/project.json'))
          print('CONTRACT_OK',c.get('ok'),'TOTAL',c.get('total_items'),'CAP_INDEX',c.get('market_cap_index'))
          print('CONTRACT_TOP50')
          for x in c.get('items',[]):
              row=x.get('row') if isinstance(x.get('row'),dict) else {}
              print(x.get('rank_index'), x.get('market_cap_rank'), x.get('base_asset'), x.get('provider'), row.get('symbol'), row.get('base_asset'), row.get('quote_asset'))
          rows=s.get('rows',[])
          btc=[]
          for r in rows:
              vals=' '.join(str(r.get(k,'')) for k in ('symbol','base_asset','raw_symbol','native_symbol')).upper()
              if 'BTC' in vals or 'XBT' in vals:
                  btc.append({k:r.get(k) for k in ('provider','symbol','base_asset','quote_asset','raw_symbol','native_symbol','last_price','price_change_percent_24h','quote_volume_24h')})
          print('SNAPSHOT_TOTAL',s.get('total_row_count'),'BTC_LIKE_COUNT',len(btc))
          print('BTC_LIKE_ROWS',json.dumps(btc[:30],ensure_ascii=False))
          print('PROJECT_TOP20',[(x.get('market_cap_rank'),x.get('symbol'),x.get('coin_id'),x.get('contract_market_count')) for x in p.get('items',[])])
          PY
