name: Step1060.33.6 contract basis partial-provider apply

on:
  push:
    branches: [step1060-33-6-basis-partial-provider]
    paths:
      - '.github/workflows/step1060-33-6-basis-partial-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Fetch candidate patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/kaka666888nb-cell/kaka-contract-realtime-worker/step1060-33-6-basis-partial-provider/.github/step1060_33_6_contract_basis_partial_patch.py' -o /tmp/patch.py
      - name: Apply and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/patch.py
          npm run check
          grep -q "650.8.15.197.3.3.32.6-basis-partial-provider-isolation" src/contract-basis.mjs
          grep -q "KAKA_CONTRACT_BASIS_MIN_READY_PROVIDERS || 4" src/contract-basis.mjs
          grep -q "market_light_inputs_below_minimum_ready" src/contract-basis.mjs
          grep -q "preserve_unavailable_cache: true" src/contract-basis.mjs
          test "$(grep -c '^function mergePartialProviderSnapshot' src/contract-basis.mjs)" = '1'
          echo 'PASS Step1060.33.6 static partial-provider gate'
      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kaka666888nb-cell'
          git config user.email 'kaka666888nb@gmail.com'
          git add src/contract-basis.mjs
          if git diff --cached --quiet; then
            echo 'No production change to commit'
            exit 0
          fi
          git commit -m 'Step1060.33.6 allow partial contract basis provider readiness'
          git push origin HEAD:main
