name: Jinse upstream shape probe
on:
  push:
    branches: [step1072-9-contract-advanced-health-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node - <<'NODE'
          const urls=[
            'http://api.coinmeta.info/live/list?limit=200&id=530050',
            'http://api.coinmeta.info/live/list?limit=200&bottom_id=530050',
            'http://api.coinmeta.info/live/list?limit=200&top_id=530050',
            'http://api.coinmeta.info/live/list?limit=200&before=530051',
            'http://api.coinmeta.info/live/list?limit=200&max_id=530050'
          ];
          const tv=v=>v==null?'':String(v);
          const collect=(j)=>{
            const out=[];
            const walk=(v,d=0)=>{
              if(d>8||v==null)return;
              if(Array.isArray(v)){for(const x of v)walk(x,d+1);return;}
              if(typeof v!=='object')return;
              const keys=['title','name','headline','content_prefix','contentPrefix','prefix','content','description','summary','text','body'];
              if(keys.some(k=>tv(v[k]).length>0)){out.push(v);return;}
              for(const k of ['lives','live','list','items','news','records','rows','data','result','children']) if(v[k]!=null) walk(v[k],d+1);
            };
            walk(j); return out;
          };
          for(const url of urls){
            try{
              const r=await fetch(url,{headers:{accept:'application/json,text/plain,*/*','user-agent':'KakaWeb3-Jinse-History-Audit/1.0'}});
              const t=await r.text(); let j; try{j=JSON.parse(t)}catch{console.log('CASE',url,'HTTP',r.status,'NONJSON',t.slice(0,120));continue;}
              const items=collect(j);
              const ids=items.map(x=>Number(x.id)).filter(Number.isFinite);
              const wanted=items.filter(x=>String(x.id)==='530050'||String(x.id)==='530151').map(x=>({
                id:x.id,
                title:tv(x.title||x.content_prefix||x.content).slice(0,180),
                created_at:x.created_at,
                link:x.link||x.url||x.link_url||''
              }));
              console.log('CASE',url,'HTTP',r.status,'COUNT',items.length,'MIN',ids.length?Math.min(...ids):null,'MAX',ids.length?Math.max(...ids):null,'ROOT_BOTTOM',j?.bottom_id,'ROOT_TOP',j?.top_id,'WANTED',JSON.stringify(wanted));
            }catch(e){console.log('CASE',url,'ERROR',String(e?.message||e));}
          }
          NODE
