name: Jinse historical identity probe
on:
  push:
    branches: [step1072-9-contract-advanced-health-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node - <<'NODE'
          const ids=[529973,529977,529982,529983,530020,530050,530071,530074,530112,530131,530137,530151,530158,530159,530160,530180,530191,530199,530224,530239,530267,530308,530367,530376,530389,530417,530439,530489,530491];
          const tv=v=>v==null?'':String(v);
          const collect=(j)=>{
            const out=[];
            const walk=(v,d=0)=>{
              if(d>8||v==null)return;
              if(Array.isArray(v)){for(const x of v)walk(x,d+1);return;}
              if(typeof v!=='object')return;
              const keys=['title','name','headline','content_prefix','contentPrefix','prefix','content','description','summary','text','body'];
              if(keys.some(k=>tv(v[k]).length>0)){out.push(v);return;}
              for(const k of ['lives','live','list','items','news','records','rows','data','result','children']) if(v[k]!=null) walk(v[k],d+1);
            };
            walk(j); return out;
          };
          for(const id of ids){
            const url='http://api.coinmeta.info/live/list?limit=200&id='+(id+1);
            try{
              const r=await fetch(url,{headers:{accept:'application/json,text/plain,*/*','user-agent':'KakaWeb3-Jinse-History-Audit/1.1'}});
              const t=await r.text(); let j; try{j=JSON.parse(t)}catch{console.log('JINSE_OFFICIAL',id,JSON.stringify({http:r.status,error:'non_json'}));continue;}
              const item=collect(j).find(x=>String(x.id)===String(id));
              console.log('JINSE_OFFICIAL',id,JSON.stringify(item?{
                http:r.status,id:item.id,
                title:tv(item.title||item.name||item.headline||item.content_prefix||item.contentPrefix||item.prefix||item.content).slice(0,500),
                content:tv(item.content||item.description||item.summary||item.text||item.body).slice(0,1000),
                link:tv(item.link||item.url||item.link_url||item.source_url||item.origin_url||item.jump_url),
                created_at:item.created_at??item.create_time??item.time??item.timestamp??item.published_at
              }:{http:r.status,error:'target_not_found',bottom:j?.bottom_id,top:j?.top_id}));
            }catch(e){
              console.log('JINSE_OFFICIAL',id,JSON.stringify({error:String(e?.message||e)}));
            }
          }
          NODE
