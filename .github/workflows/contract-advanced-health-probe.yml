name: Contract advanced production health probe
on:
  push:
    branches: [step1072-9-contract-advanced-health-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node - <<'NODE'
          const base='https://kaka-contract-realtime-worker.onrender.com';
          const h=await (await fetch(base+'/api/gate-advanced/health')).json();
          const syms=h?.contract_stats_history?.focus_symbols||[];
          const out=[];
          for(const s of syms){
            const native=s.replace(/USDT$/,'_USDT');
            const r=await fetch('https://api.gateio.ws/api/v4/futures/usdt/contract_stats?contract='+encodeURIComponent(native)+'&interval=5m&limit=3',{headers:{accept:'application/json','user-agent':'KakaWeb3-Audit-Probe/1.0'}});
            const j=await r.json().catch(()=>null);
            const row=Array.isArray(j)&&j.length?j[0]:null;
            out.push({
              symbol:s,http:r.status,rows:Array.isArray(j)?j.length:null,
              time:row?.time??null,lsr_taker:row?.lsr_taker??null,
              long_taker_size:row?.long_taker_size??null,short_taker_size:row?.short_taker_size??null,
              long_taker_present:row?Object.prototype.hasOwnProperty.call(row,'long_taker_size'):false,
              short_taker_present:row?Object.prototype.hasOwnProperty.call(row,'short_taker_size'):false
            });
            await new Promise(r=>setTimeout(r,260));
          }
          console.log('GATE_TAKER_OFFICIAL',JSON.stringify(out));
          const deep=await (await fetch(base+'/api/contract-deep-shared/current-snapshot')).json();
          console.log('GATE_DEEP_FLOW',JSON.stringify((deep?.rows||[]).filter(x=>x.provider==='gate').map(x=>({
            symbol:x.symbol,flow_ready:x.flow_ready,flow_buy_quote:x.flow_buy_quote,
            flow_sell_quote:x.flow_sell_quote,flow_source:x.flow_source
          }))));
          NODE
