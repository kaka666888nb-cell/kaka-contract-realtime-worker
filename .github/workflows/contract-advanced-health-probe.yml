name: Contract advanced production health probe
on:
  push:
    branches: [step1072-9-contract-advanced-health-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node - <<'NODE'
          const base='https://kaka-contract-realtime-worker.onrender.com';
          async function get(path){
            const r=await fetch(base+path,{headers:{accept:'application/json','user-agent':'KakaWeb3-Audit-Probe/1.0'}});
            const t=await r.text(); let j=null; try{j=JSON.parse(t)}catch{}
            console.log('\nPATH',path,'HTTP',r.status); return j;
          }
          const root=await get('/health');
          function walk(o,p='',out=[]){
            if(!o||typeof o!=='object') return out;
            for(const [k,v] of Object.entries(o)){
              const q=p? p+'.'+k:k;
              if(/depth|binance_ws_connect|contract_deep/i.test(q) && (v==null||typeof v!=='object')) out.push([q,v]);
              if(v&&typeof v==='object'&&q.split('.').length<5) walk(v,q,out);
            }
            return out;
          }
          console.log('ROOT_DEPTH',JSON.stringify(walk(root).slice(0,300)));
          const deep=await get('/api/contract-deep-shared/health');
          console.log('DEEP',JSON.stringify({
            ready:deep?.ready,live_ready:deep?.live_ready,
            depth_fresh_rows:deep?.depth_fresh_rows,depth_refresh_error_rows:deep?.depth_refresh_error_rows,
            flow_active_rows:deep?.flow_active_rows,flow_connected_rows:deep?.flow_connected_rows,
            provider_coverage:deep?.provider_coverage,
            last_completed_at:deep?.last_completed_at,last_error:deep?.last_error
          }));
          const gateH=await get('/api/gate-advanced/health');
          console.log('GATE_H',JSON.stringify({
            ready:gateH?.ready,row_count:gateH?.row_count,
            last_focus_started_at:gateH?.last_focus_started_at,last_focus_completed_at:gateH?.last_focus_completed_at,
            last_focus_error:gateH?.last_focus_error,contract_stats_rows:gateH?.contract_stats_rows,
            risk_limit_rows:gateH?.risk_limit_rows,
            hist_ready:gateH?.contract_stats_history_ready,
            hist_coverage:gateH?.contract_stats_history_official_5m_coverage,
            focus_symbols:gateH?.contract_stats_history?.focus_symbols
          }));
          const gate=await get('/api/gate-advanced/current-snapshot');
          console.log('GATE_ZBT',JSON.stringify((gate?.rows||[]).find(x=>String(x.symbol||'').toUpperCase()==='ZBTUSDT')||null));
          NODE
