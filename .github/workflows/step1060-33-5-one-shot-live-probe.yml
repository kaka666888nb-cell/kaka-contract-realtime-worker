name: Step1060.33.5 one-shot live probe

on:
  push:
    branches: [step1060-33-5-binance-delivery]
    paths:
      - '.github/workflows/step1060-33-5-one-shot-live-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read live Binance delivery diagnostics only
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://kaka-contract-realtime-worker.onrender.com'
          curl --compressed -fsS --connect-timeout 8 --max-time 25 "$BASE/api/binance-contract-market-health" -o /tmp/bm.json
          curl --compressed -fsS --connect-timeout 8 --max-time 25 "$BASE/api/contract-basis/health" -o /tmp/bh.json
          python3 -c "import json; d=json.load(open('/tmp/bm.json')); r=d.get('delivery_ws_reuse') or {}; diag=r.get('diagnostics') or {}; print('BINANCE_MARKET_VERSION',d.get('version')); print('DELIVERY_ROWS',r.get('rows'),'LAST_EVENT',r.get('last_delivery_event_at')); print('DIAG',json.dumps(diag,ensure_ascii=False,sort_keys=True)); print('WS_INGRESS',json.dumps(d.get('websocket_ingress') or {},ensure_ascii=False,sort_keys=True)); print('STREAMS',json.dumps(d.get('streams') or {},ensure_ascii=False,sort_keys=True)); print('AUTOMATIC_REST',d.get('automatic_rest_enabled'))"
          python3 -c "import json; d=json.load(open('/tmp/bh.json')); de=d.get('delivery') or {}; print('BASIS_VERSION',d.get('version')); print('BASIS_LAST_ERROR',d.get('last_error')); print('DELIVERY_LATEST_READY',de.get('latest_ready'),'ROWS',de.get('latest_row_count'),'REFRESHES',de.get('total_refreshes')); print('BINANCE_COVERAGE',json.dumps((de.get('latest_provider_coverage') or {}).get('binance'),ensure_ascii=False)); print('BINANCE_REST',de.get('binance_contract_rest_requests'),'EXTRA_WS',de.get('binance_delivery_additional_websocket_connections'))"
