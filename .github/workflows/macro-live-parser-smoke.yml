name: Macro live parser smoke
on:
  push:
    branches: [step1072-9-contract-advanced-health-probe]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node - <<'NODE'
          const decodeHtml=(text)=>text
            .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,' ')
            .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,' ')
            .replace(/<[^>]+>/g,' ')
            .replace(/&nbsp;|&#160;/gi,' ')
            .replace(/&amp;/gi,'&')
            .replace(/&ndash;|&mdash;/gi,'-')
            .replace(/[‐‑‒–—−]/g,'-')
            .replace(/\s+/g,' ').trim();
          const months={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12};
          const monthNum=(s)=>months[String(s||'').toLowerCase()]||null;
          const monthFirstDate=(raw)=>{
            const m=String(raw||'').trim().replace(/,/g,'').match(/^([A-Za-z]+)\s+(\d{1,2})\s+(20\d{2})$/);
            if(!m||!monthNum(m[1])) return null;
            return `${m[3]}-${String(monthNum(m[1])).padStart(2,'0')}-${String(Number(m[2])).padStart(2,'0')}`;
          };
          const monthDayWithYear=(raw,year)=>monthFirstDate(`${raw}, ${year}`);
          const signed=(verb,raw)=>{
            const value=Number(raw); if(!Number.isFinite(value)) return null;
            const v=String(verb).toLowerCase();
            if(/decreas|declin|drop|fell|fall|moved down|edged down|ticked down/.test(v)) return -Math.abs(value);
            if(/unchanged|flat|little changed|virtually unchanged|held steady/.test(v)) return 0;
            return Math.abs(value);
          };
          const fetchText=async(url)=>{
            const r=await fetch(url,{headers:{accept:'text/html,application/xhtml+xml,*/*','user-agent':'KakaWeb3/1.0 (+macro parser smoke)','accept-language':'en-US,en;q=0.9','cache-control':'no-cache'}});
            if(!r.ok) throw new Error(`${url}:http_${r.status}`);
            return await r.text();
          };

          const dolUrl='https://www.dol.gov/newsroom/releases?agency=39&state=All&topic=All&year=all';
          const dolText=decodeHtml(await fetchText(dolUrl));
          const re=/([A-Z][a-z]+\s+\d{1,2},\s+20\d{2})\s+Unemployment Insurance Weekly Claims Report[\s\S]{0,1400}?week ending\s+([A-Z][a-z]+\s+\d{1,2}),\s+the advance figure for seasonally adjusted initial claims was\s+([\d,]+),[\s\S]{0,900}?4-week moving average was\s+([\d,]+)/gi;
          const dolRows=[];
          for(const m of dolText.matchAll(re)){
            const release=monthFirstDate(m[1]); if(!release) continue;
            const year=Number(release.slice(0,4));
            let week=monthDayWithYear(m[2],year); if(week&&week>release) week=monthDayWithYear(m[2],year-1);
            if(!week) continue;
            dolRows.push({release,week,claims:Number(m[3].replace(/,/g,''))/1000,avg:Number(m[4].replace(/,/g,''))/1000});
          }
          dolRows.sort((a,b)=>b.release.localeCompare(a.release));
          console.log('DOL_ROWS',dolRows.length,JSON.stringify(dolRows.slice(0,4)));
          if(!dolRows.length) throw new Error('dol_no_rows');
          if(dolRows[0].release!=='2026-09-17'||dolRows[0].week!=='2026-09-12'||dolRows[0].claims!==196||dolRows[0].avg!==203.25){
            throw new Error('dol_latest_mismatch:'+JSON.stringify(dolRows[0]));
          }

          const fedUrl='https://www.federalreserve.gov/releases/g17/current/default.htm';
          const fedText=decodeHtml(await fetchText(fedUrl));
          const release=fedText.match(/Release Date:\s*(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{1,2}),\s+(20\d{2})/i);
          if(!release) throw new Error('fed_release_missing');
          const releaseDate=`${release[3]}-${String(monthNum(release[1])).padStart(2,'0')}-${String(Number(release[2])).padStart(2,'0')}`;
          const direct=fedText.match(/Industrial production(?: \(IP\))?\s+(increased|decreased|rose|fell|grew|declined|dropped|ticked up|edged up|moved up|moved down|edged down|ticked down)\s+([0-9.]+)\s+percent in\s+(January|February|March|April|May|June|July|August|September|October|November|December)/i);
          const joint=fedText.match(/Industrial production(?: \(IP\))?\s+and\s+manufacturing production\s+each\s+(increased|decreased|rose|fell|grew|declined|dropped)\s+([0-9.]+)\s+percent in\s+(January|February|March|April|May|June|July|August|September|October|November|December)/i);
          const flat=fedText.match(/Industrial production(?: \(IP\))?\s+(?:was|remained)\s+(?:unchanged|flat|little changed|virtually unchanged|steady)\s+in\s+(January|February|March|April|May|June|July|August|September|October|November|December)/i);
          const monthName=direct?.[3]??joint?.[3]??flat?.[1];
          if(!monthName) throw new Error('fed_month_missing');
          const month=monthNum(monthName); let year=Number(releaseDate.slice(0,4)); if(month>Number(releaseDate.slice(5,7))) year--;
          const ipMom=flat?0:signed((direct??joint)[1],(direct??joint)[2]);
          const manufacturing=fedText.match(/Manufacturing (?:output|production)\s+(increased|decreased|rose|fell|grew|declined|dropped|ticked up|edged up|moved up|moved down|edged down|ticked down)\s+([0-9.]+)\s+percent|Manufacturing (?:output|production) was unchanged|Manufacturing (?:output|production) was flat/i);
          const mfg=manufacturing?(/unchanged|flat/i.test(manufacturing[0])?0:signed(manufacturing[1]??'',manufacturing[2]??'')):null;
          const index=fedText.match(/At\s+([0-9.]+)\s+percent of its 2017 average, total (?:industrial production|IP)/i);
          const yoy=fedText.match(/total (?:industrial production|IP)[^.]{0,100}?was\s+([0-9.]+)\s+percent\s+(above|below)\s+its year-earlier level/i);
          const util=fedText.match(/Capacity utilization(?: was unchanged at| remained unchanged at| edged up to| moved up to| rose to| stepped up to| receded to| declined to| fell to)\s+([0-9.]+)\s+percent/i);
          const previous=fedText.match(/Industrial production(?: \(IP\))?[^.]{0,220}?\s+in\s+(January|February|March|April|May|June|July|August|September|October|November|December)\s+after\s+(increasing|decreasing|rising|falling|growing|declining|dropping|edging up|edging down|ticking up|ticking down|moving up|moving down)\s+([0-9.]+)\s+percent in\s+(January|February|March|April|May|June|July|August|September|October|November|December)/i);
          let previousRow=null;
          if(previous){
            const previousMonth=monthNum(previous[4]);
            let previousYear=year;
            if(previousMonth>month) previousYear-=1;
            previousRow={reference:`${previousYear}-${String(previousMonth).padStart(2,'0')}`,ipMom:signed(previous[2],previous[3])};
          }
          const fed={releaseDate,reference:`${year}-${String(month).padStart(2,'0')}`,ipMom,mfg,index:index?Number(index[1]):null,yoy:yoy?(yoy[2].toLowerCase()==='below'?-Number(yoy[1]):Number(yoy[1])):null,util:util?Number(util[1]):null,previousRow};
          console.log('FED_ROW',JSON.stringify(fed));
          if(fed.releaseDate!=='2026-09-18'||fed.reference!=='2026-08'||fed.ipMom!==0||fed.mfg!==-0.3||fed.index!==103.1||fed.yoy!==1.4||fed.util!==76.3||fed.previousRow?.reference!=='2026-07'||fed.previousRow?.ipMom!==0.2){
            throw new Error('fed_latest_mismatch:'+JSON.stringify(fed));
          }
          console.log('MACRO_PARSER_SMOKE_PASS');
          NODE
