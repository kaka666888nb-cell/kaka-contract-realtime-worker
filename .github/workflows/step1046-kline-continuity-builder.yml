name: Step1046 Kline Continuity Builder

on:
  push:
    branches:
      - step1046-2-5-kline-continuity

permissions:
  contents: write

jobs:
  build-candidate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: step1046-2-5-kline-continuity
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Decode and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/step1046_kline_patch.py.gz.b64 | gzip -dc > /tmp/step1046_kline_patch.py
          python3 /tmp/step1046_kline_patch.py

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check src/kline-derived.mjs
          node --check src/exchange-asset-kline.mjs
          node --check src/onchain-market.mjs
          git diff --check

      - name: Shared derivation correctness self-test
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            KAKA_FULL_INTERVALS,
            klineDerivedPlan,
            deriveAndFillKlines,
          } from './src/kline-derived.mjs';

          const h = 60 * 60 * 1000;
          const base = Date.UTC(2026, 7, 28, 0, 0, 0);
          const rows = [
            { open_time_ms: base, open: 10, high: 12, low: 9, close: 11, volume: 4, quote_volume: 44, source: 'test' },
            { open_time_ms: base + 2*h, open: 13, high: 14, low: 12, close: 13, volume: 2, quote_volume: 26, source: 'test' },
          ];
          const filled = deriveAndFillKlines(rows, '1h', {
            sourceInterval: '1h', source: 'test', sessionMode: 'continuous_24x7', limit: 20,
          });
          if (filled.rows.length !== 3) throw new Error(`expected 3 rows after bounded gap fill, got ${filled.rows.length}`);
          const flat = filled.rows[1];
          if (!(flat.open === 11 && flat.high === 11 && flat.low === 11 && flat.close === 11 && flat.volume === 0)) {
            throw new Error('bounded no-trade fill is not flat previous-close volume=0');
          }
          const twoH = deriveAndFillKlines([
            { open_time_ms: base, open: 10, high: 12, low: 9, close: 11, volume: 4, quote_volume: 44, source: 'test' },
            { open_time_ms: base + h, open: 11, high: 15, low: 10, close: 14, volume: 6, quote_volume: 80, source: 'test' },
          ], '2h', { sourceInterval: '1h', source: 'test', sessionMode: 'continuous_24x7', limit: 20 });
          if (twoH.rows.length !== 1 || twoH.rows[0].open !== 10 || twoH.rows[0].high !== 15 || twoH.rows[0].low !== 9 || twoH.rows[0].close !== 14 || twoH.rows[0].volume !== 10) {
            throw new Error('2h exact OHLCV derivation failed');
          }
          const overnight = deriveAndFillKlines([
            { open_time_ms: Date.UTC(2026,7,28,23), open: 10, high: 10, low: 10, close: 10, volume: 1, source: 'stock' },
            { open_time_ms: Date.UTC(2026,7,29,2), open: 11, high: 11, low: 11, close: 11, volume: 1, source: 'stock' },
          ], '1h', { sourceInterval: '1h', source: 'stock', sessionMode: 'intraday_only', limit: 20 });
          if (overnight.zero_trade_fill_count !== 0 || overnight.rows.length !== 2) throw new Error('intraday stock policy incorrectly filled overnight closure');
          if (klineDerivedPlan('2h')?.base !== '1h' || klineDerivedPlan('1M')?.base !== '1d') throw new Error('derived plan mismatch');
          for (const x of ['1m','3m','5m','15m','30m','1h','2h','4h','6h','8h','12h','1d','3d','1w','1M']) {
            if (!KAKA_FULL_INTERVALS.includes(x)) throw new Error(`missing interval ${x}`);
          }
          console.log('PASS shared K-line derivation + bounded continuity self-test');
          NODE

      - name: Static contract gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q "step1046_2_5_asset_kline_continuity_v1" src/exchange-asset-kline.mjs
          grep -q "step1046_2_5_onchain_kline_continuity_v1" src/onchain-market.mjs
          grep -q "zero_trade_fill_tail_extrapolation: false" src/exchange-asset-kline.mjs
          grep -q "zero_trade_fill_tail_extrapolation: false" src/onchain-market.mjs
          grep -q "intraday_only" src/exchange-asset-kline.mjs
          grep -q "continuous_24x7" src/onchain-market.mjs
          if grep -q "api.binance.com" src/exchange-asset-kline.mjs; then
            echo "Unexpected Binance REST reference in exchange asset K-line module" >&2
            exit 1
          fi

      - name: Commit generated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kaka Step1046 Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f scripts/step1046_kline_patch.py.gz.b64 .github/workflows/step1046-kline-continuity-builder.yml
          git add src/kline-derived.mjs src/exchange-asset-kline.mjs src/onchain-market.mjs
          git diff --cached --check
          git commit -m "Step1046.2.5 shared K-line continuity and derived intervals [skip ci]"
          git push origin HEAD:step1046-2-5-kline-continuity
