name: Step1060.33.5 candidate verify

on:
  push:
    branches: [step1060-33-5-binance-delivery]
    paths:
      - 'src/binance-contract-market.mjs'
      - 'src/contract-basis.mjs'
      - 'tests/step1060_33_5_binance_delivery_selftest.mjs'
      - '.github/workflows/step1060-33-5-candidate-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step1060-33-5-binance-delivery
      - name: Syntax and safety gates
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node tests/step1060_33_5_binance_delivery_selftest.mjs
          ! grep -nE 'https://(dapi|fapi)\.binance\.com' src/contract-basis.mjs
          grep -q "const AUTOMATIC_REST_ENABLED = false" src/binance-contract-market.mjs
          grep -q "const DELIVERY_SOURCE_PROVIDERS = Object.freeze(\['binance', 'okx', 'bybit', 'bitget', 'gate'\])" src/contract-basis.mjs
          grep -q "symbol_type_filter: 2" src/binance-contract-market.mjs
          grep -q "binance_delivery_additional_websocket_connections: 0" src/contract-basis.mjs
          grep -q "binance_contract_rest_guard_preserved: true" src/contract-basis.mjs
          grep -q "quote_not_usdt_same_quote_required" src/contract-basis.mjs
          test "$(grep -c '^async function collectBinanceDelivery' src/contract-basis.mjs)" = '1'
          test "$(grep -c '^export function getBinanceDeliveryContractsSnapshot' src/binance-contract-market.mjs)" = '1'
          echo 'PASS Step1060.33.5 candidate syntax + WS-only safety + duplicate guard'
