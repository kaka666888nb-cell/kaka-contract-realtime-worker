name: Step1046.2.6 translation rollover check

on:
  push:
    branches:
      - step1046-2-6-translation-day-rollover

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check src/content-translation.mjs
      - name: Pacific day rollover self-test
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const mod = await import('./src/content-translation.mjs?rollover_test=' + Date.now());
          const expected = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'America/Los_Angeles', year: 'numeric', month: '2-digit', day: '2-digit',
          }).format(new Date());
          const first = mod.getSharedTranslationHealth();
          if (first.daily_budget_day_key !== expected) {
            throw new Error(`day_key mismatch ${first.daily_budget_day_key} != ${expected}`);
          }
          if (first.daily_budget_rollovers !== 1) {
            throw new Error(`expected first rollover=1 got ${first.daily_budget_rollovers}`);
          }
          if (first.daily_characters_used !== 0 || first.daily_requests !== 0) {
            throw new Error('fresh rollover must expose zero local daily view before persisted reload');
          }
          const second = mod.getSharedTranslationHealth();
          if (second.daily_budget_rollovers !== 1) {
            throw new Error(`health read repeated rollover unexpectedly: ${second.daily_budget_rollovers}`);
          }
          if (second.requests !== 0 || second.user_translation_requests !== 0) {
            throw new Error('health rollover must not issue translation requests');
          }
          console.log(`PASS Pacific day=${expected} rollovers=${second.daily_budget_rollovers} provider_requests=${second.requests}`);
          NODE
