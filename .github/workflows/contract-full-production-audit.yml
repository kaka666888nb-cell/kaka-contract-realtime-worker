name: Contract full production audit probe
on:
  push:
    branches: [step1072-9-contract-advanced-health-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node - <<'NODE'
          const base='https://kaka-contract-realtime-worker.onrender.com';
          const paths=[
            '/api/contract-deep-shared/health',
            '/api/contract-flow/health',
            '/api/binance-advanced/health',
            '/api/okx-advanced/health',
            '/api/bybit-advanced/health',
            '/api/bitget-advanced/health',
            '/api/gate-advanced/health',
            '/api/contract-funding/health',
            '/api/contract-liquidation/health'
          ];
          const rx=/(^|_)(ok|ready|live_ready|row_count|rows|coverage|error|fail|stale|connected|complete|persist|write|read|request|user|scale|open_interest|funding|ratio|risk|liquid|insurance|adl|depth|flow|history|target|provider|current)/i;
          function filter(v,depth=0){
            if(depth>4) return undefined;
            if(Array.isArray(v)){
              if(v.length<=25 && v.every(x=>['string','number','boolean'].includes(typeof x))) return v;
              return undefined;
            }
            if(v && typeof v==='object'){
              const o={};
              for(const [k,val] of Object.entries(v)){
                if(rx.test(k)){
                  if(val && typeof val==='object') {
                    const z=filter(val,depth+1); if(z!==undefined) o[k]=z;
                  } else o[k]=val;
                } else if(val && typeof val==='object'){
                  const z=filter(val,depth+1);
                  if(z && Object.keys(z).length) o[k]=z;
                }
              }
              return o;
            }
            return v;
          }
          for(const path of paths){
            try{
              const r=await fetch(base+path,{headers:{accept:'application/json','user-agent':'KakaWeb3-Contract-Audit/1.0'}});
              const t=await r.text(); let j=null; try{j=JSON.parse(t)}catch{}
              console.log('AUDIT_PATH',path,'HTTP',r.status);
              console.log('AUDIT_JSON',JSON.stringify(filter(j||{raw:t.slice(0,1000)})));
            }catch(e){
              console.log('AUDIT_PATH',path,'FETCH_ERROR',String(e?.message||e));
            }
          }
          NODE
