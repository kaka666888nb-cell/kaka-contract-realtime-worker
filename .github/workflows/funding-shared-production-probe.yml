name: Funding shared-read production probe
on:
  push:
    branches: [step1072-9-contract-advanced-health-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node - <<'NODE'
          const base='https://kaka-contract-realtime-worker.onrender.com';
          const paths=[
            '/api/contract-funding/health',
            '/api/contract-funding?provider=okx&symbol=BTCUSDT&history_mode=none',
            '/api/contract-funding?provider=gate&symbol=XMRUSDT&history_mode=none',
            '/api/contract-funding/history?provider=okx&symbol=BTCUSDT&limit=5'
          ];
          for(const path of paths){
            try{
              const r=await fetch(base+path,{headers:{accept:'application/json','user-agent':'KakaWeb3-Funding-Audit/1.0'}});
              const t=await r.text(); let j; try{j=JSON.parse(t)}catch{j={raw:t.slice(0,1000)}}
              const out={
                ok:j?.ok,version:j?.version,provider:j?.provider,symbol:j?.symbol,
                source:j?.source,current_route_mode:j?.current_route_mode,
                user_reads_trigger_exchange_requests:j?.user_reads_trigger_exchange_requests,
                user_reads_trigger_exchange_connections:j?.user_reads_trigger_exchange_connections,
                reads_scale_with_users:j?.reads_scale_with_users,
                exchange_requests_started:j?.exchange_requests_started,
                exchange_connections_started:j?.exchange_connections_started,
                current_stale:j?.current_stale,current_age_ms:j?.current_age_ms,
                partial:j?.partial,cache_state:j?.cache_state,
                current:j?.current?{
                  last_funding_rate:j.current.last_funding_rate,
                  next_funding_time:j.current.next_funding_time,
                  source_time:j.current.source_time,
                  mark_price:j.current.mark_price,
                  index_price:j.current.index_price
                }:null,
                history_count:Array.isArray(j?.history)?j.history.length:j?.history_count,
                warning:j?.warning,warnings:j?.warnings,
                error:j?.error,reason:j?.reason
              };
              console.log('AUDIT_PATH',path,'HTTP',r.status);
              console.log('AUDIT_JSON',JSON.stringify(out));
            }catch(e){
              console.log('AUDIT_PATH',path,'FETCH_ERROR',String(e?.message||e));
            }
          }
          NODE
