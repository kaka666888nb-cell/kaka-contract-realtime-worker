name: Funding shared-read production probe
on:
  push:
    branches: [step1072-9-contract-advanced-health-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node - <<'NODE'
          const base='https://kaka-contract-realtime-worker.onrender.com';
          const paths=[
            '/api/contract-funding/health',
            '/api/contract-funding?provider=okx&symbol=BTCUSDT&history_mode=none',
            '/api/contract-funding?provider=gate&symbol=XMRUSDT&history_mode=none',
            '/api/contract-funding/history?provider=okx&symbol=BTCUSDT&limit=5',
            '/api/gate-advanced/health',
            '/api/contract-deep-shared/health',
            '/api/contract-flow/health',
            '/api/contract-basis/health',
            '/api/contract-liquidation/health'
          ];
          for(const path of paths){
            try{
              const r=await fetch(base+path,{headers:{accept:'application/json','user-agent':'KakaWeb3-Funding-Audit/1.1'}});
              const t=await r.text(); let j; try{j=JSON.parse(t)}catch{j={raw:t.slice(0,1000)}}
              let out;
              if(path==='/api/gate-advanced/health'){
                out={
                  ok:j.ok,ready:j.ready,focus_target:j.focus_target,
                  contract_row_count:j.contract_row_count,contract_stats_rows:j.contract_stats_rows,
                  risk_limit_rows:j.risk_limit_rows,open_interest_rows:j.open_interest_rows,
                  contract_stats_history_ready:j.contract_stats_history_ready,
                  contract_stats_history_official_5m_coverage:j.contract_stats_history_official_5m_coverage,
                  full_focus_advanced_coverage_ready:j.full_focus_advanced_coverage_ready,
                  exchange_requests_started_by_user_read:j.exchange_requests_started_by_user_read,
                  user_reads_trigger_collector:j.user_reads_trigger_collector,
                  last_focus_error:j.last_focus_error,last_focus_change_recovery_error:j.last_focus_change_recovery_error
                };
              }else if(path==='/api/contract-deep-shared/health'){
                out={
                  ok:j.ok,ready:j.ready,row_count:j.row_count,target_rows:j.target_rows,
                  depth_fresh_rows:j.depth_fresh_rows,flow_active_rows:j.flow_active_rows,
                  flow_connected_rows:j.flow_connected_rows,flow_value_rows:j.flow_value_rows,
                  provider_coverage:j.provider_coverage,
                  exchange_requests_started_by_user_read:j.exchange_requests_started_by_user_read,
                  exchange_connections_started_by_user_read:j.exchange_connections_started_by_user_read,
                  last_error:j.last_error
                };
              }else if(path==='/api/contract-basis/health'){
                out={
                  ok:j.ok,enabled:j.enabled,latest_ready:j.latest_ready,
                  latest_full_input_ready:j.latest_full_input_ready,
                  latest_partial_input_ready:j.latest_partial_input_ready,
                  latest_provider_ready_count:j.latest_provider_ready_count,
                  latest_row_count:j.latest_row_count,
                  additional_exchange_requests_per_build:j.additional_exchange_requests_per_build,
                  additional_exchange_connections_per_build:j.additional_exchange_connections_per_build,
                  snapshot_reads_start_exchange_requests:j.snapshot_reads_start_exchange_requests,
                  snapshot_reads_start_exchange_connections:j.snapshot_reads_start_exchange_connections,
                  snapshot_reads_scale_with_users:j.snapshot_reads_scale_with_users,
                  no_cross_provider_substitution:j.no_cross_provider_substitution,
                  no_cross_quote_substitution:j.no_cross_quote_substitution,
                  missing_values_remain_null:j.missing_values_remain_null,
                  last_error:j.last_error,
                  delivery:j.delivery?{
                    latest_ready:j.delivery.latest_ready,
                    latest_partial:j.delivery.latest_partial,
                    latest_provider_ready_count:j.delivery.latest_provider_ready_count,
                    latest_row_count:j.delivery.latest_row_count,
                    user_reads_start_exchange_requests:j.delivery.user_reads_start_exchange_requests,
                    reads_scale_with_users:j.delivery.reads_scale_with_users,
                    binance_contract_rest_requests:j.delivery.binance_contract_rest_requests,
                    binance_shared_ws_warm_last_error:j.delivery.binance_shared_ws_warm_last_error
                  }:null
                };
              }else if(path==='/api/contract-liquidation/health'){
                const s=j.shared_current_health||{};
                const g=j.gate_liq_orders||{};
                const b=j.bitget_liquidations_history||{};
                out={
                  ok:j.ok,version:j.version,persistence_enabled:j.persistence_enabled,
                  persist_queue:j.persist_queue,persist_inflight:j.persist_inflight,
                  minute_persist_queue:j.minute_persist_queue,minute_persist_inflight:j.minute_persist_inflight,
                  flush_error:j.flush_error,minute_flush_error:j.minute_flush_error,cleanup_error:j.cleanup_error,
                  exchange_requests_started_by_history_reads:j.exchange_requests_started_by_history_reads,
                  current_snapshot_reads_start_exchange_connections:j.current_snapshot_reads_start_exchange_connections,
                  current_snapshot_scales_with_users:j.current_snapshot_scales_with_users,
                  step998_liquidation_heatmap_ready:j.step998_liquidation_heatmap_ready,
                  step998_heatmap_user_reads_trigger_requests:j.step998_heatmap_user_reads_trigger_requests,
                  step998_heatmap_reads_scale_with_users:j.step998_heatmap_reads_scale_with_users,
                  step998_heatmap_exchange_requests_started_by_reads:j.step998_heatmap_exchange_requests_started_by_reads,
                  shared_current_health:{
                    current_snapshot_rows:s.current_snapshot_rows,
                    current_snapshot_connected_provider_count:s.current_snapshot_connected_provider_count,
                    market_snapshot_directory_symbols:s.market_snapshot_directory_symbols,
                    market_snapshot_connected_symbols:s.market_snapshot_connected_symbols,
                    market_snapshot_complete_symbols:s.market_snapshot_complete_symbols,
                    market_snapshot_event_symbols:s.market_snapshot_event_symbols,
                    market_snapshot_event_rows:s.market_snapshot_event_rows,
                    market_snapshot_full_directory_connected:s.market_snapshot_full_directory_connected,
                    market_snapshot_full_window_coverage_complete:s.market_snapshot_full_window_coverage_complete,
                    market_snapshot_reads_start_exchange_connections:s.market_snapshot_reads_start_exchange_connections,
                    market_snapshot_exchange_connections_started_per_read:s.market_snapshot_exchange_connections_started_per_read,
                    market_snapshot_scales_with_users:s.market_snapshot_scales_with_users,
                    market_collector_topology_exact:s.market_collector_topology_exact,
                    focused_usdt_duplicate_feed_count:s.focused_usdt_duplicate_feed_count,
                    market_collector_feed_count:s.market_collector_feed_count,
                    market_collector_expected_feed_count:s.market_collector_expected_feed_count
                  },
                  gate_liq_orders:{
                    enabled:g.enabled,ready:g.ready,last_error:g.last_error,
                    user_reads_trigger_requests:g.user_reads_trigger_requests,
                    reads_scale_with_users:g.reads_scale_with_users,
                    last_completed_at:g.last_completed_at,last_rows:g.last_rows,
                    coverage_complete:g.coverage_complete
                  },
                  bitget_liquidations_history:{
                    enabled:b.enabled,collector_ready:b.collector_ready,
                    official_endpoint_operational:b.official_endpoint_operational,
                    official_response_cycles:b.official_response_cycles,
                    official_category_responses:b.official_category_responses,
                    official_empty_category_responses:b.official_empty_category_responses,
                    attempts:b.attempts,successes:b.successes,failures:b.failures,
                    complete_windows:b.complete_windows,deferred_windows:b.deferred_windows,
                    deferred_windows_total:b.deferred_windows_total,
                    delayed_conflict_deferred_windows:b.delayed_conflict_deferred_windows,
                    incomplete_deferred_windows:b.incomplete_deferred_windows,
                    official_empty_windows_seen:b.official_empty_windows_seen,
                    ws_conflict_retry_windows:b.ws_conflict_retry_windows,
                    last_rows:b.last_rows,last_requests:b.last_requests,
                    last_window_start:b.last_window_start,last_window_end:b.last_window_end,
                    next_deferred_retry_at:b.next_deferred_retry_at,
                    last_deferred_reason:b.last_deferred_reason,
                    last_official_response_at:b.last_official_response_at,
                    last_completed_at:b.last_completed_at,last_error:b.last_error,
                    user_reads_trigger_requests:b.user_reads_trigger_requests,
                    reads_scale_with_users:b.reads_scale_with_users
                  }
                };
              }else if(path==='/api/contract-flow/health'){
                out={
                  ok:j.ok,
                  binance_official_taker:j.binance_official_taker?{
                    ready:j.binance_official_taker.ready,
                    current_instance_full_sweep_completed:j.binance_official_taker.current_instance_full_sweep_completed,
                    current_instance_success_coverage_rows:j.binance_official_taker.current_instance_success_coverage_rows,
                    current_instance_success_missing_symbols:j.binance_official_taker.current_instance_success_missing_symbols,
                    official_coverage_rows:j.binance_official_taker.official_coverage_rows,
                    pending_refresh_debt_count:j.binance_official_taker.pending_refresh_debt_count,
                    pending_refresh_debt_symbols:j.binance_official_taker.pending_refresh_debt_symbols,
                    last_error:j.binance_official_taker.last_error
                  }:null,
                  gate_advanced_flow_bridge:j.gate_advanced_flow_bridge?{
                    rows_seen:j.gate_advanced_flow_bridge.rows_seen,
                    rows_hydrated:j.gate_advanced_flow_bridge.rows_hydrated,
                    failures:j.gate_advanced_flow_bridge.failures,
                    last_error:j.gate_advanced_flow_bridge.last_error,
                    exchange_requests_added:j.gate_advanced_flow_bridge.exchange_requests_added
                  }:null,
                  focus_pool_binding:j.focus_pool_binding
                };
              }else{
                out={
                  ok:j?.ok,version:j?.version,provider:j?.provider,symbol:j?.symbol,
                  source:j?.source,current_route_mode:j?.current_route_mode,
                  user_reads_trigger_exchange_requests:j?.user_reads_trigger_exchange_requests,
                  user_reads_trigger_exchange_connections:j?.user_reads_trigger_exchange_connections,
                  reads_scale_with_users:j?.reads_scale_with_users,
                  exchange_requests_started:j?.exchange_requests_started,
                  exchange_connections_started:j?.exchange_connections_started,
                  current_stale:j?.current_stale,current_age_ms:j?.current_age_ms,
                  partial:j?.partial,cache_state:j?.cache_state,
                  current:j?.current?{
                    last_funding_rate:j.current.last_funding_rate,
                    next_funding_time:j.current.next_funding_time,
                    source_time:j.current.source_time,
                    mark_price:j.current.mark_price,index_price:j.current.index_price
                  }:null,
                  history_count:Array.isArray(j?.history)?j.history.length:j?.history_count,
                  warning:j?.warning,warnings:j?.warnings,error:j?.error,reason:j?.reason
                };
              }
              console.log('AUDIT_PATH',path,'HTTP',r.status);
              console.log('AUDIT_JSON',JSON.stringify(out));
            }catch(e){
              console.log('AUDIT_PATH',path,'FETCH_ERROR',String(e?.message||e));
            }
          }
          NODE
