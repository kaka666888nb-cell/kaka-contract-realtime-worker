name: Step1073 R61 spot quote catalog audit

on:
  push:
    branches: [main]
    paths:
      - 'src/market-rest.mjs'
      - 'src/market-light-snapshot.mjs'
      - '.github/workflows/step1073-r61-spot-quote-catalog-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify six-provider shared spot quote catalog
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://kaka-contract-realtime-worker.onrender.com'
          ready=0
          for i in $(seq 1 36); do
            if curl --compressed -fsS --connect-timeout 8 --max-time 35 "$BASE/api/spot-quote-catalog" -o /tmp/quotes.json; then
              schema="$(python3 -c "import json; print(json.load(open('/tmp/quotes.json')).get('schema',''))" 2>/dev/null || true)"
              echo "poll=$i schema=$schema"
              if [ "$schema" = "step1073_r64_spot_quote_catalog_v3" ]; then
                ready=1
                break
              fi
            fi
            sleep 5
          done
          test "$ready" = 1
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/quotes.json','r',encoding='utf-8'))
          assert p.get('ok') is True, p
          assert p.get('schema') == 'step1073_r64_spot_quote_catalog_v3', p
          assert p.get('native_symbol_identity_policy') == 'ascii_exact_fail_closed', p
          assert p.get('read_only_shared') is True, p
          assert p.get('reads_scale_with_users') is False, p
          assert p.get('parser_covers_current_catalog') is True, p
          assert (p.get('unsupported_quote_assets') or []) == [], p
          providers=p.get('providers') or []
          names={str(x.get('provider') or '') for x in providers}
          expected={'binance','okx','bybit','bitget','gate','coinbase'}
          assert names == expected, (names, expected)
          rows=p.get('rows') or []
          assert rows, p
          assert int(p.get('total_quote_assets') or 0) == len(rows), p
          byq={str(x.get('quote_asset') or ''):x for x in rows}
          for q in ('USDT','USDC','USD'):
              assert q in byq, q
          print('PASS provider_count=',len(providers),
                'total_products=',p.get('total_products'),
                'total_quote_assets=',len(rows))
          print('GLOBAL_QUOTES')
          for x in rows:
              print(x.get('quote_asset'),
                    'products=',x.get('product_count'),
                    'providers=',x.get('provider_count'),
                    json.dumps(x.get('providers') or {},sort_keys=True))
          print('PROVIDER_QUOTES')
          for x in sorted(providers,key=lambda y:y.get('provider','')):
              print(x.get('provider'),
                    'products=',x.get('product_count'),
                    'quotes=',','.join(q.get('quote_asset','') for q in (x.get('quotes') or [])))
          PY

          curl --compressed -fsS --connect-timeout 8 --max-time 20 \
            "$BASE/api/asset-quote-summary?base=BTC" -o /tmp/btc-quotes.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/btc-quotes.json','r',encoding='utf-8'))
          assert p.get('ok') is True, p
          assert p.get('base_asset') == 'BTC', p
          rows={str(x.get('quote_asset') or ''):x for x in (p.get('rows') or [])}
          assert 'FDUSD' in rows, rows
          fd=rows['FDUSD']
          providers=fd.get('providers') or {}
          spot={k for k,v in providers.items() if int((v or {}).get('spot_count') or 0)>0}
          assert spot == {'binance'}, fd
          assert int(fd.get('spot_count') or 0) >= 1, fd
          print('PASS BTC asset quote summary',
                'quotes=',len(rows),
                'FDUSD_spot_providers=',sorted(spot),
                'RLUSD_spot_providers=',sorted(
                  k for k,v in (rows.get('RLUSD',{}).get('providers') or {}).items()
                  if int((v or {}).get('spot_count') or 0)>0
                ),
                'USDS_spot_providers=',sorted(
                  k for k,v in (rows.get('USDS',{}).get('providers') or {}).items()
                  if int((v or {}).get('spot_count') or 0)>0
                ))
          PY

          ready=0
          for i in $(seq 1 120); do
            curl --compressed -fsS --connect-timeout 8 --max-time 20 \
              "$BASE/api/market-light/watchlist-tickers?items=spot%7Cbinance%7CBTCFDUSD" \
              -o /tmp/fdusd.json
            if python3 - <<'PY'
          import json,sys
          p=json.load(open('/tmp/fdusd.json','r',encoding='utf-8'))
          assert p.get('ok') is True, p
          assert p.get('binance_spot_non_usdt_focus_shared_ws') is True, p
          assert int(p.get('user_read_upstream_requests') or 0) == 0, p
          assert p.get('reads_scale_with_users') is False, p
          items=p.get('items') or []
          assert len(items)==1, p
          item=items[0]
          if item.get('ready') is not True or not isinstance(item.get('row'),dict):
              sys.exit(2)
          row=item['row']
          assert item.get('provider')=='binance', item
          assert item.get('market_type')=='spot', item
          assert item.get('symbol')=='BTCFDUSD', item
          assert row.get('symbol')=='BTCFDUSD', row
          assert float(row.get('last_price') or row.get('price') or 0) > 0, row
          assert row.get('reads_scale_with_users') is False, row
          assert int(row.get('user_upstream_requests') or 0) == 0, row
          print('PASS non_usdt_shared_exact_ticker BTCFDUSD',
                'source=',row.get('watchlist_realtime_source') or row.get('source'),
                'price=',row.get('last_price') or row.get('price'))
          PY
            then
              ready=1
              break
            fi
            echo "BTCFDUSD shared focus not ready poll=$i"
            sleep 1
          done
          test "$ready" = 1
