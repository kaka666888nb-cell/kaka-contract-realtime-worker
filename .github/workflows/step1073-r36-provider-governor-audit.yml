name: Step1073 R38 production route diagnostic

on:
  push:
    branches:
      - audit-step1073-r36-provider-governor
    paths:
      - '.github/workflows/step1073-r36-provider-governor-audit.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Diagnose production depth stream routes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://kaka-contract-realtime-worker.onrender.com'
          for path in             '/api/contract-depth/stream-health'             '/api/contract-depth/stream-self-test'
          do
            code="$(curl --compressed -sS --connect-timeout 8 --max-time 20 -D /tmp/hdr.txt -o /tmp/body.txt -w '%{http_code}' "$BASE$path" || true)"
            echo "PATH=$path CODE=$code"
            echo "--- headers ---"
            cat /tmp/hdr.txt || true
            echo "--- body ---"
            cat /tmp/body.txt || true
            echo
          done
          python3 - <<'PY'
          import http.client, ssl, time
          host='kaka-contract-realtime-worker.onrender.com'
          path='/api/contract-depth/stream?provider=binance&market_type=contract&symbol=BTCUSDT&view=orderbook&limit=20'
          c=http.client.HTTPSConnection(host,timeout=15,context=ssl.create_default_context())
          c.request('GET',path,headers={'Accept':'text/event-stream','Cache-Control':'no-cache'})
          r=c.getresponse()
          print('STREAM status=',r.status,'content-type=',r.getheader('content-type'),'schema=',r.getheader('x-kaka-stream-schema'))
          deadline=time.time()+8
          lines=[]
          while time.time()<deadline and len(lines)<12:
              line=r.readline().decode('utf-8','replace').rstrip()
              lines.append(line)
              if line.startswith('data:') and '"bids"' in line:
                  break
          print('\n'.join(lines))
          c.close()
          PY
