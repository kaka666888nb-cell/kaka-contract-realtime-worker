name: Step1073 R37B downstream HTTP 50-concurrency audit

on:
  push:
    branches:
      - audit-step1073-r36-provider-governor
    paths:
      - '.github/workflows/step1073-r36-provider-governor-audit.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run finite cached-orderbook load
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures, urllib.request, urllib.error, time, json, collections
          url='https://kaka-contract-realtime-worker.onrender.com/api/contract-depth?provider=binance&market_type=contract&symbol=BTCUSDT&view=orderbook&limit=20'
          def one(_):
              t=time.perf_counter()
              try:
                  req=urllib.request.Request(url, headers={'User-Agent':'KakaWeb3-R37B-capacity-audit'})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body=r.read()
                      code=r.status
                      cache=r.headers.get('x-kaka-cache','')
                      ok=False
                      try:
                          p=json.loads(body)
                          ok=(p.get('ok') is True and isinstance(p.get('bids'),list) and isinstance(p.get('asks'),list))
                      except Exception:
                          pass
                  return code,cache,ok,(time.perf_counter()-t)*1000
              except urllib.error.HTTPError as e:
                  return e.code,'',False,(time.perf_counter()-t)*1000
              except Exception as e:
                  return 0,type(e).__name__,False,(time.perf_counter()-t)*1000
          warm=one(-1)
          print('warm=',warm)
          total=500
          workers=50
          start=time.perf_counter()
          with concurrent.futures.ThreadPoolExecutor(max_workers=workers) as ex:
              rows=list(ex.map(one, range(total)))
          elapsed=time.perf_counter()-start
          lat=sorted(x[3] for x in rows)
          codes=collections.Counter(x[0] for x in rows)
          caches=collections.Counter(x[1] for x in rows)
          oks=sum(1 for x in rows if x[2])
          def pct(p):
              if not lat:return None
              i=min(len(lat)-1,max(0,int(round((len(lat)-1)*p))))
              return round(lat[i],2)
          print('total=',total,'workers=',workers,'elapsed_s=',round(elapsed,3),'rps=',round(total/elapsed,2))
          print('codes=',dict(codes),'payload_ok=',oks,'cache_states=',dict(caches))
          print('lat_ms p50=',pct(.50),'p95=',pct(.95),'p99=',pct(.99),'max=',round(max(lat),2))
          assert codes == {200: total}, codes
          assert oks == total, oks
          assert pct(.99) < 8000, pct(.99)
          PY
