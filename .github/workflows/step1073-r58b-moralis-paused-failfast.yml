name: Step1073 R58 Moralis paused-provider fail-fast

on:
  push:
    branches: [main]
    paths:
      - 'src/onchain-market.mjs'
      - '.github/workflows/step1073-r58b-moralis-paused-failfast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify paused-provider fail-fast across Kline and trades
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://kaka-contract-realtime-worker.onrender.com'
          TOKEN='0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2'
          POOL='0x88e6A0c2dDD26FEEb64F039a2c41296FcB3f5640'

          health() {
            curl -fsS --connect-timeout 8 --max-time 25 "$BASE/api/onchain/health"
          }

          used_cu() {
            python3 -c "import json,sys; b=json.load(sys.stdin); print((((b.get('sources') or {}).get('moralis') or {}).get('budget') or {}).get('used_cu') or 0)"
          }

          circuit_reason() {
            python3 -c "import json,sys; b=json.load(sys.stdin); print((((b.get('sources') or {}).get('moralis') or {}).get('kline_circuit') or {}).get('reason') or '')"
          }

          H0="$(health)"
          U0="$(printf '%s' "$H0" | used_cu)"
          echo "used_before=$U0"

          END1="$(python3 -c "import time; print(int((time.time()-12*24*3600)*1000))")"
          URL1="$BASE/api/onchain/klines?network=ethereum&address=$TOKEN&pool_address=$POOL&interval=1h&limit=2&end_time=$END1"
          C1="$(curl -sS --connect-timeout 8 --max-time 55 -o /tmp/one.json -w '%{http_code}' "$URL1" || true)"
          echo "probe1_http=$C1"
          test "$C1" = "200"
          python3 -c "import json; b=json.load(open('/tmp/one.json')); assert b.get('ok') is True,b; err=str(b.get('primary_error') or '').lower(); assert ('moralis_http_401' in err and ('usage is paused' in err or 'upgrade to a paid plan' in err or 'planselect' in err)) or err.startswith('moralis_kline_circuit_open:moralis_free_usage_paused'),err; assert b.get('fallback_used') is True,b; print('PASS probe1 paused/circuit + Gecko fallback')"

          H1="$(health)"
          U1="$(printf '%s' "$H1" | used_cu)"
          R1="$(printf '%s' "$H1" | circuit_reason)"
          echo "used_after_probe1=$U1 circuit_reason=$R1"
          test "$R1" = "moralis_free_usage_paused"

          END2="$(python3 -c "import time; print(int((time.time()-13*24*3600)*1000))")"
          URL2="$BASE/api/onchain/klines?network=ethereum&address=$TOKEN&pool_address=$POOL&interval=1h&limit=2&end_time=$END2"
          C2="$(curl -sS --connect-timeout 8 --max-time 55 -o /tmp/two.json -w '%{http_code}' "$URL2" || true)"
          echo "probe2_http=$C2"
          test "$C2" = "200"
          python3 -c "import json; b=json.load(open('/tmp/two.json')); assert b.get('ok') is True,b; err=str(b.get('primary_error') or ''); assert err.startswith('moralis_kline_circuit_open:moralis_free_usage_paused') or err.startswith('moralis_provider_circuit_open:moralis_free_usage_paused'),err; assert b.get('fallback_used') is True,b; print('PASS probe2 Kline circuit fail-fast + Gecko fallback')"

          H2="$(health)"
          U2="$(printf '%s' "$H2" | used_cu)"
          echo "used_after_probe2=$U2"
          test "$U2" = "$U1"
          echo "PASS second distinct Kline cache miss consumed zero additional Moralis CU"

          # Non-Kline proof: choose an uncommon trade limit to avoid an existing cache key.
          # This route has no Gecko trade fallback, so the expected response is a bounded 503
          # with the shared provider circuit error and zero additional Moralis CU.
          URL3="$BASE/api/onchain/trades?network=ethereum&address=$TOKEN&pool_address=$POOL&limit=37"
          C3="$(curl -sS --connect-timeout 8 --max-time 35 -o /tmp/three.json -w '%{http_code}' "$URL3" || true)"
          echo "probe3_http=$C3"
          test "$C3" = "503"
          python3 -c "import json; b=json.load(open('/tmp/three.json')); err=str(b.get('error') or ''); assert err.startswith('moralis_provider_circuit_open:moralis_free_usage_paused'),err; print('PASS trades shared provider circuit fail-fast')"

          H3="$(health)"
          U3="$(printf '%s' "$H3" | used_cu)"
          R3="$(printf '%s' "$H3" | circuit_reason)"
          echo "used_after_probe3=$U3 circuit_reason=$R3"
          test "$U3" = "$U2"
          test "$R3" = "moralis_free_usage_paused"
          echo "PASS non-Kline Moralis route consumed zero additional CU while provider paused"

      - name: Full onchain self-test remains green
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://kaka-contract-realtime-worker.onrender.com'
          curl -fsS --connect-timeout 8 --max-time 30 "$BASE/api/onchain/self-test" -o /tmp/self.json
          python3 -c "import json; b=json.load(open('/tmp/self.json')); failed=[x for x in (b.get('tests') or []) if x.get('pass') is not True]; assert b.get('ok') is True,failed; print('PASS onchain self-test tests=',len(b.get('tests') or []))"
