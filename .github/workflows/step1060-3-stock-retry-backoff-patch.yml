name: Step1060.3 stock retry backoff patch

on:
  push:
    branches: [main]
    paths:
      - '.github/step1060_3_stock_retry_patch.py'
      - '.github/workflows/step1060-3-stock-retry-backoff-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-stock-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/step1060_3_stock_retry_patch.py
          node --check src/stock-catalog-v2.mjs
          grep -q 'KAKA_STOCK_CATALOG_FAILURE_RETRY_BACKOFF_MS' src/stock-catalog-v2.mjs
          grep -q 'startup_previous_refresh_failure_backoff' src/stock-catalog-v2.mjs
          git diff --check

      - name: Commit stock retry guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kaka Step1060 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/stock-catalog-v2.mjs
          git commit -m 'Step1060.3 back off failed stock refresh across Render restarts'
          git push origin main
